<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="">
  <title>Dashboard - wMaktab</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard" data-role="">

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 22l8 22 8-14 8 14 8-22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">wMaktab</span>
      </a>

      <nav class="nav" id="nav" aria-label="Main navigation"></nav>

      <div class="side-foot">
        <div class="user-mini" id="user-mini"></div>
        <button class="btn side-logout" type="button" data-act="logout">
          <span id="logout-icon"></span> Log out
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" data-act="close-menu"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" data-act="toggle-menu" aria-label="Open menu" id="menu-btn"></button>
        <h1 class="top-title" id="page-title">Dashboard</h1>
        <span class="spacer"></span>
        <span class="pill year-pill" id="year-pill"></span>
        <a class="user-chip" href="#/profile" id="user-chip" aria-label="My profile"></a>
      </header>

      <main class="view" id="view" tabindex="-1">
        <div class="skeleton-wrap">
          <div class="skeleton" style="height:120px"></div>
          <div class="skeleton" style="height:220px"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px">wMaktab needs JavaScript to run.</p></noscript>
  <script src="js/backend.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
